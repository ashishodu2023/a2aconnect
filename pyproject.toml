[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2aconnect"
version = "0.1.0"
description = "A2AConnect — SDK-agnostic agent interop runtime (LF A2A–compatible). Complements MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "A2AConnect contributors" }]
keywords = ["a2aconnect", "lf-a2a", "agent-interop", "mcp", "multi-agent", "gateway"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://www.a2aconnect.dev"
Documentation = "https://www.a2aconnect.dev/docs"
Repository = "https://github.com/ashishodu2023/a2aconnect"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "jinja2>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
a2aconnect = "a2aconnect.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a2aconnect"]

[tool.hatch.build.targets.wheel.sources]
"src/a2aconnect" = "a2aconnect"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
